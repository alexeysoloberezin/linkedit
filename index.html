<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191919; --panel:#232323; --panel-2:#2a2a2a; --line:#353535; --line-2:#444;
    --text:#e9e9e7; --muted:#9b9b9b; --dim:#6f6f6f;
    --accent:#ff6d5a; --accent-soft:rgba(255,109,90,.12);
    --ok:#4cc38a; --ok-soft:rgba(76,195,138,.12);
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{background-image:radial-gradient(circle,#2a2a2a 1px,transparent 1px);background-size:22px 22px;min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:48px 20px 80px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:600}
  h1{font-size:28px;font-weight:600;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 32px 46px}
  .flow{display:flex;flex-direction:column;gap:0}
  .node{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:relative}
  .node:focus-within{border-color:var(--line-2);box-shadow:0 0 0 1px var(--line-2)}
  .connector{height:22px;margin-left:30px;border-left:2px solid var(--line-2);position:relative}
  .connector::after{content:"";position:absolute;left:-5px;bottom:-4px;width:8px;height:8px;border-radius:50%;background:var(--line-2)}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .ico{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
  .ico.a{color:var(--accent);background:var(--accent-soft);border-color:transparent}
  .ico.g{color:var(--ok);background:var(--ok-soft);border-color:transparent}
  .title{font-weight:600}
  .hint{color:var(--dim);font-size:12px;margin-left:auto}
  input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:10px 12px;font:13px/1.5 var(--mono);outline:none;transition:border-color .15s}
  textarea{resize:vertical;min-height:64px}
  input:focus,textarea:focus{border-color:var(--accent)}
  input::placeholder,textarea::placeholder{color:#555}
  .params{margin-top:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .params:empty{display:none}
  .row{display:grid;grid-template-columns:20px minmax(90px,170px) 1fr;gap:10px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font:12px/1.4 var(--mono)}
  .row:first-child{border-top:0}
  .row:hover{background:var(--panel-2)}
  .row .k{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .v{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.off .k,.row.off .v{color:var(--dim);text-decoration:line-through}
  .row input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);margin:0;padding:0}
  .meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
  .pill.warn{color:var(--accent);border-color:rgba(255,109,90,.35)}
  .out{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font:13px/1.6 var(--mono);word-break:break-all;min-height:46px;color:var(--text)}
  .out .q{color:var(--dim)} .out .ok{color:var(--accent)} .out .vv{color:#c9c9c6}
  .out.empty{color:#555}
  .actions{display:flex;gap:8px;margin-top:12px}
  button{font:500 13px Inter,sans-serif;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--text);transition:.15s}
  button:hover{border-color:var(--line-2);background:#303030}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel-2);border:1px solid var(--line-2);padding:8px 14px;border-radius:8px;font-size:13px;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (max-width:560px){.sub{margin-left:0}.row{grid-template-columns:20px 1fr}.row .v{grid-column:2}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">↗</div><h1>Link Edit</h1></header>
  <p class="sub">Переносит UTM / gclid параметры со ссылки на новый домен и добавляет тег <code>a=</code>.</p>

  <div class="flow">
    <div class="node">
      <div class="head"><div class="ico">1</div><div class="title">Исходная ссылка</div><div class="hint">параметры после ?</div></div>
      <textarea id="src" rows="3" spellcheck="false" placeholder="https://mrqz.to/...?gad_source=2&gclid=..."></textarea>
      <div class="params" id="params"></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="connector"></div>
    <div class="node">
      <div class="head"><div class="ico a">a=</div><div class="title">Тег a</div><div class="hint">ставится первым параметром</div></div>
      <input id="tag" spellcheck="false" placeholder="251-5014-323">
    </div>
    <div class="connector"></div>
    <div class="node">
      <div class="head"><div class="ico">⌂</div><div class="title">Домен</div><div class="hint">https:// добавится сам</div></div>
      <input id="domain" spellcheck="false" placeholder="https://google.com">
    </div>
    <div class="connector"></div>
    <div class="node">
      <div class="head"><div class="ico g">✓</div><div class="title">Результат</div><div class="hint" id="count"></div></div>
      <div class="out empty" id="out">Заполните домен</div>
      <div class="actions">
        <button class="primary" id="copy" disabled>Копировать</button>
        <button id="open" disabled>Открыть</button>
        <button id="clear">Очистить</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast">Скопировано</div>

<script>
const $ = id => document.getElementById(id);
const src = $('src'), tag = $('tag'), domain = $('domain');
let parsed = [];            // [{k, v}]
const disabled = new Set(); // ключи, выключенные чекбоксом
let result = '';

function parseParams(text){
  text = text.trim();
  if(!text) return [];
  const i = text.indexOf('?');
  let qs = i >= 0 ? text.slice(i + 1) : (text.includes('=') ? text : '');
  qs = qs.split('#')[0];
  const out = [];
  new URLSearchParams(qs).forEach((v, k) => { if(k) out.push({k, v}); });
  return out;
}

function normDomain(d){
  d = d.trim();
  if(!d) return null;
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(d)) d = 'https://' + d;
  try { return new URL(d); } catch { return null; }
}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderParams(){
  const box = $('params');
  box.innerHTML = parsed.map((p, i) =>
    `<label class="row ${disabled.has(p.k) ? 'off' : ''}">
       <input type="checkbox" data-k="${esc(p.k)}" ${disabled.has(p.k) ? '' : 'checked'}>
       <span class="k" title="${esc(p.k)}">${esc(p.k)}</span>
       <span class="v" title="${esc(p.v)}">${esc(p.v) || '<i>пусто</i>'}</span>
     </label>`).join('');
  const meta = $('meta');
  const hasA = parsed.some(p => p.k === 'a');
  meta.innerHTML = src.value.trim()
    ? `<span class="pill">${parsed.length} параметров</span>` +
      (hasA ? `<span class="pill warn">a= уже есть в ссылке${tag.value.trim() ? ' — заменится' : ''}</span>` : '')
    : '';
}

function build(){
  const url = normDomain(domain.value);
  const out = $('out');
  const a = tag.value.trim();
  const params = new URLSearchParams();

  // 1) a — первым
  const srcA = parsed.find(p => p.k === 'a' && !disabled.has('a'));
  if(a) params.set('a', a);
  else if(srcA) params.set('a', srcA.v);

  // 2) параметры самого домена (если были)
  if(url) url.searchParams.forEach((v, k) => { if(k !== 'a' && !params.has(k)) params.append(k, v); });

  // 3) параметры исходной ссылки
  parsed.forEach(p => {
    if(p.k === 'a' || disabled.has(p.k)) return;
    if(url && url.searchParams.has(p.k)) params.delete(p.k);
    params.append(p.k, p.v);
  });

  if(!url){
    result = '';
    out.className = 'out empty';
    out.textContent = domain.value.trim() ? 'Некорректный домен' : 'Заполните домен';
    $('count').textContent = '';
  } else {
    const base = url.origin + (url.pathname === '/' ? '' : url.pathname);
    const qs = params.toString();
    result = base + (qs ? '?' + qs : '') + url.hash;
    out.className = 'out';
    const parts = [];
    params.forEach((v, k) => parts.push(`<span class="ok">${esc(encodeURIComponent(k))}</span><span class="q">=</span><span class="vv">${esc(encodeURIComponent(v))}</span>`));
    out.innerHTML = esc(base) + (parts.length ? '<span class="q">?</span>' + parts.join('<span class="q">&amp;</span>') : '') + esc(url.hash);
    $('count').textContent = [...params.keys()].length + ' параметров';
  }
  $('copy').disabled = $('open').disabled = !result;
}

function update(){ parsed = parseParams(src.value); renderParams(); build(); save(); }

function save(){ try{ localStorage.setItem('linkedit', JSON.stringify({tag: tag.value, domain: domain.value})); }catch{} }
function load(){ try{ const s = JSON.parse(localStorage.getItem('linkedit') || '{}'); tag.value = s.tag || ''; domain.value = s.domain || ''; }catch{} }

$('params').addEventListener('change', e => {
  const k = e.target.dataset.k; if(k == null) return;
  e.target.checked ? disabled.delete(k) : disabled.add(k);
  renderParams(); build();
});
[src, tag, domain].forEach(el => el.addEventListener('input', update));

function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1400); }
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(result); }
  catch { const t = document.createElement('textarea'); t.value = result; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('Скопировано');
};
$('open').onclick = () => window.open(result, '_blank', 'noopener');
$('clear').onclick = () => { src.value = ''; disabled.clear(); update(); src.focus(); };

load(); update();
</script>
</body>
</html>
